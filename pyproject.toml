[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-mmm"
version = "1.0.0"
description = "Production-grade Bayesian Marketing Mix Model using PyMC for ROI quantification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Kaushik Mukherjee", email = "mukherjeekaushik107@gmail.com"}
]
keywords = ["bayesian", "marketing-mix-model", "pymc", "causal-inference", "roi", "attribution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pymc==5.15.1",
    "arviz==0.17.1",
    "pytensor==2.20.1",
    "pandas==2.1.4",
    "numpy==1.26.4",
    "matplotlib==3.8.2",
    "scikit-learn>=1.3.0",
    "mlflow>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
notebooks = [
    "jupyter>=1.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/kaushikmastro/BayesianMMM"
Documentation = "https://github.com/kaushikmastro/BayesianMMM/wiki"
Repository = "https://github.com/kaushikmastro/BayesianMMM.git"
"Bug Tracker" = "https://github.com/kaushikmastro/BayesianMMM/issues"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html"
